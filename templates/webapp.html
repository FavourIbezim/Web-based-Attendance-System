<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Page</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    /* Header section with logo */
    .header {
      position: absolute;
      top: 15px;
      left: 20px;
      display: flex;
      align-items: center;
    }

    .header img {
      height: 50px;
    }

    .header h1 {
      margin-left: 15px;
      font-size: 20px;
      color: #2c3e50;
    }

    /* Title in the center */
    header h1 {
      color: #2c3e50;
      font-size: 32px;
      margin-bottom: 40px;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .button {
      display: inline-block;
      width: 280px;
      padding: 18px;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      color: white;
      background: #3498db;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    .button:hover {
      background: #2980b9;
      transform: translateY(-2px);
    }

    footer {
      position: absolute;
      bottom: 15px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- Header with logo -->
  <div class="header">
    <img src="../static/uploads/UNN_LOGO.jpg" alt="Logo">
    <h1>Attendance System Dashboard</h1>
  </div>

  <!-- Page title -->
  <header>
    <h1>Facial Recognition Attendance System</h1>
  </header>

  <!-- Buttons -->
  <div class="button-container">
    <a href="http://127.0.0.1:5001" class="button">Register Student</a>
    <a href="http://127.0.0.1:5002/camera" class="button">Take Attendance</a>
  </div>

  <!-- Footer -->
  <footer>
    &copy; 2025 Attendance System | Powered by ECE025 Final Year Project
  </footer>

</body>
</html>
